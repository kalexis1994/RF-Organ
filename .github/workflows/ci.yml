# RF-Organ builds against the RackForge SDK as a git dependency pinned by
# revision, and Cargo.lock records that revision. The package is validated by
# the host's own tools, which come from the same revision, so RackForge is
# checked out beside RF-Organ at whatever the lock says - read from the lock by
# `tools/pins.sh`, never kept here as a second copy that can disagree with it.
#
# The play surface's generated half (`app.js` and `app_bg.wasm`) is not
# committed: wasm-bindgen output carries the build machine's paths and cannot
# be compared across machines, so it is built here from the sources, with the
# wasm-bindgen the lock pins, before the package is inspected.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Validation builds do not benefit from incremental artifacts and they grow
  # the cache for nothing.
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Tests, lints and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out RF-Organ
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: RF-Organ
          persist-credentials: false

      - name: Read the pins from the lockfile
        id: pins
        shell: bash
        working-directory: RF-Organ
        run: |
          echo "rackforge=$(bash tools/pins.sh rackforge)" >> "$GITHUB_OUTPUT"
          echo "wasm_bindgen=$(bash tools/pins.sh wasm-bindgen)" >> "$GITHUB_OUTPUT"

      - name: Check out the RackForge host tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          ref: ${{ steps.pins.outputs.rackforge }}
          path: rackforge
          persist-credentials: false

      - name: Lint this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color RF-Organ/.github/workflows/ci.yml

      - name: Install native dependencies
        shell: bash
        # rackforge-core links ALSA and udev on Linux; RF-Organ itself needs
        # neither, but the package validation runs through the host.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: RF-Organ
          key: rf-organ-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned wasm-bindgen
        shell: bash
        working-directory: RF-Organ
        env:
          WASM_BINDGEN_VERSION: ${{ steps.pins.outputs.wasm_bindgen }}
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Check formatting
        shell: bash
        working-directory: RF-Organ
        run: cargo fmt --all -- --check

      - name: Lint
        shell: bash
        working-directory: RF-Organ
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        working-directory: RF-Organ
        run: cargo test --locked --workspace

      - name: Build the plugin and the surface for wasm32
        shell: bash
        working-directory: RF-Organ
        run: |
          cargo build --locked --release -p rf-organ-plugin --target wasm32-unknown-unknown
          bash tools/build-surface.sh
      - name: Validate the package
        shell: bash
        working-directory: RF-Organ
        run: |
          cargo run --locked --manifest-path ../rackforge/Cargo.toml \
            --target-dir target/rackforge-core -p rackforge-core -- inspect package
          target/rackforge-core/debug/rackforge-core smoke package --preset gospel-full

      - name: Check that the committed component matches the sources
        shell: bash
        working-directory: RF-Organ
        run: |
          bash tools/check-package.sh \
            target/rackforge-core/debug/rackforge-core \
            target/wasm32-unknown-unknown/release/rf_organ_plugin.wasm

      - name: Sweep sample rates and benchmark the engine
        shell: bash
        working-directory: RF-Organ
        run: cargo run --locked --release -p rf-organ-lab -- sweep artifacts/sweep

      - name: Publish the sweep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-rate-sweep
          path: |
            RF-Organ/artifacts/sweep/sample-rate-invariance.csv
            RF-Organ/artifacts/sweep/performance.csv
          if-no-files-found: error
