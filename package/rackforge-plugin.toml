# Schema 3: the host reads `short_name` for narrow controller surfaces and the
# branding section for the artwork it shows. `tools/make-artwork.py` draws
# those three PNGs from the same palette as the play surface.
schema_version = 3
id = "org.rackforge.organ"
name = "RF-Organ"
short_name = "RF-ORGAN"
vendor = "RackForge"
version = "0.35.0"
description = "Physical-model tonewheel organ with an integrated rotary speaker module"
kind = "instrument"
state_version = 15
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#17120D"
accent_color = "#C9A058"

[midi]
channel_model = "multi_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Upper, Lower and Pedal"

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"
