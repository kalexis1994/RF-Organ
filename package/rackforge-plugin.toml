# Schema 1 keeps this first runnable research build independent of final
# branding assets. Move to schema 3 when the production artwork lands.
schema_version = 1
id = "org.rackforge.organ"
name = "RF-Organ"
short_name = "RF-ORGAN"
vendor = "RackForge"
version = "0.4.0"
description = "Physical-model tonewheel organ with an integrated rotary speaker module"
kind = "instrument"
state_version = 4
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]

[midi]
channel_model = "multi_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Upper, Lower and Pedal"

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
