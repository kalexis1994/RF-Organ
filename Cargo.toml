[workspace]
resolver = "3"
members = [
    "crates/rf-organ-dsp",
    "crates/rf-organ-lab",
    "crates/rf-organ-plugin",
    "crates/rf-organ-ui",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
rf-organ-dsp = { path = "crates/rf-organ-dsp" }
rackforge-plugin-sdk = { path = "../rackforge/crates/rackforge-plugin-sdk" }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
