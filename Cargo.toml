[workspace]
resolver = "3"
members = [
    "crates/rf-organ-dsp",
    "crates/rf-organ-lab",
    "crates/rf-organ-plugin",
    "crates/rf-organ-ui",
]

[workspace.package]
version = "0.52.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
rf-organ-dsp = { path = "crates/rf-organ-dsp" }
# The SDK comes from the RackForge revision this pins, and Cargo.lock records
# it; CI and the release read that revision back out of the lock rather than
# keeping a copy of it. To build against a local checkout instead, see README.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge", rev = "8e8991b67ddcb55507911abd93dcf52dfd6b5ef6" }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
